<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S World</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#f4eefb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
position:relative;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
}

.container img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.box{
position:relative;
z-index:2;
background:rgba(255,255,255,.75);
backdrop-filter:blur(10px);
padding:35px;
border-radius:30px;
text-align:center;
width:85%;
max-width:380px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
color:#8d63c7;
font-size:40px;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:25px;
line-height:1.8;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:40px;
background:#8d63c7;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#7449b8;
}
</style>

</head>
<body>

<div class="container">

<img src="file_000000001ef47246a001ae12f0955ef4.png">

<div class="box">
<h1>خانه سوگند 💜</h1>

<p>
به دنیای آرامش، خاطره‌ها و رویاهای سوگند خوش اومدی 🌻
</p>

<button>ورود</button>

</div>

</div>

</body>
</html>
