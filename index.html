<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خانه سوگند</title>

<style>
body{
margin:0;
background:#F5F0FF;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:tahoma;
}

img{
width:90%;
max-width:420px;
cursor:pointer;
transition:.5s;
}

img:hover{
transform:scale(1.03);
}
</style>

</head>

<body>

<img
id="door"
src="file_000000001ef47246a001ae12f0955ef4.png"
onclick="openDoor()">

<script>
function openDoor(){
document.getElementById("door").style.transform="rotateY(-90deg)";

setTimeout(function(){
alert("✨ خوش اومدی سوگند ✨");
},700);
}
</script>

</body>
</html>
