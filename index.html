<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{

background:#efe9f9;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card{

width:90%;

max-width:420px;

background:white;

border-radius:35px;

overflow:hidden;

box-shadow:0 15px 45px rgba(140,99,199,.25);

animation:show 1s;

}

@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.card img{

width:100%;

display:block;

}

.content{

padding:25px;

text-align:center;

}

h1{

font-size:42px;

color:#8D63C7;

margin-bottom:10px;

}

p{

font-size:18px;

color:#555;

line-height:32px;

margin-bottom:25px;

}

button{

width:100%;

height:60px;

border:none;

border-radius:40px;

background:#8D63C7;

color:white;

font-size:22px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.03);

}

</style>

</head>

<body>

<div class="card">

<img src="فایل_000000001ef47246a001ae12f0955ef4.png">

<div class="content">

<h1>S World 💜</h1>

<p>

🌻

به دنیای سوگند خوش آمدی

</p>

<button onclick="enterWorld()">

ورود

</button>

</div>

</div>

<script>

function enterWorld(){

document.body.innerHTML=`

<div style="height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#efe9f9;

font-size:40px;

color:#8D63C7;">

🏡

خانه سوگند

</div>

`;

}

</script>

</body>

</html>
