<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#fcf9ff,#efe3ff);
overflow:hidden;
}

.card{
width:360px;
background:white;
padding:45px;
border-radius:35px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
text-align:center;
transition:.8s;
}

.logo{
font-size:90px;
font-weight:bold;
color:#9c73d6;
margin-bottom:15px;
}

h1{
color:#7c58c2;
margin-bottom:15px;
}

p{
color:#666;
line-height:32px;
margin-bottom:35px;
}

button{
padding:16px 35px;
border:none;
border-radius:50px;
background:#9c73d6;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#door{

display:none;

width:180px;

height:320px;

background:white;

border:6px solid #d7b35d;

border-radius:12px;

position:relative;

box-shadow:0 15px 35px rgba(0,0,0,.2);

animation:fade .8s;

}

.handle{

width:14px;

height:14px;

background:gold;

border-radius:50%;

position:absolute;

right:20px;

top:150px;

}

@keyframes fade{

from{
opacity:0;
transform:scale(.9);
}

to{
opacity:1;
transform:scale(1);
}

}

</style>

</head>

<body>

<div class="card" id="home">

<div class="logo">S</div>

<h1>S World</h1>

<p>

به دنیای سوگند خوش اومدی 🌻

<br><br>

آماده‌ای وارد دنیای خودت بشی؟

</p>

<button onclick="enterWorld()">

ورود به دنیای سوگند

</button>

</div>

<div id="door">

<div class="handle"></div>

</div>

<script>

function enterWorld(){

document.getElementById("home").style.display="none";

document.getElementById("door").style.display="block";

}

</script>

</body>
</html>
